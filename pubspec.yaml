name: wallet
description: A personal wallet / expense tracker with SMS auto-import.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Local persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Formatting / IDs / hashing
  intl: ^0.19.0
  uuid: ^4.4.0
  crypto: ^3.0.5

  # SMS auto-import
  flutter_sms_inbox: ^1.0.3
  permission_handler: ^11.3.1

  # UI
  reorderables: ^0.6.0
  fl_chart: ^0.68.0

  # Backup / restore
  file_picker: ^8.1.2
  share_plus: ^10.0.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # Code generation (only needed if you regenerate the *.g.dart adapters)
  build_runner: ^2.4.11
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
